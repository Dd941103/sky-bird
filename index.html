<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sky Peck - 跨裝置體感飛行</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      position: relative;
    }

    @media (orientation: landscape) {
      #app-container { flex-direction: row; }
      #camera-viewport {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 190px;
        height: 140px;
        border-radius: 12px;
        border: 2px solid rgba(255, 255, 255, 0.85);
        z-index: 20;
        background: #111;
        overflow: hidden;
      }
      #game-viewport { width: 100vw; height: 100vh; }
      #reset-btn { top: 168px; right: 16px; width: 190px; border-radius: 8px; }
    }

    @media (orientation: portrait) {
      #app-container { flex-direction: column; }
      #camera-viewport {
        position: relative;
        width: 100%;
        height: 35%;
        border-bottom: 3px solid #ffeb3b;
        background: #111;
        overflow: hidden;
      }
      #game-viewport { position: relative; width: 100%; height: 65%; }
      #reset-btn { top: 12px; right: 12px; border-radius: 20px; padding: 6px 14px; }
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #skeleton-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #cam-tag {
      position: absolute;
      top: 8px;
      left: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #38ef7d;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }

    #game-viewport { background: #87ceeb; position: relative; overflow: hidden; }
    #ui {
      position: absolute;
      top: 14px;
      left: 16px;
      color: #fff;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 10;
    }
    #stage-title { font-size: clamp(16px, 4vw, 24px); font-weight: 800; color: #ffeb3b; }
    #score { font-size: clamp(13px, 3vw, 17px); margin-top: 3px; }

    #reset-btn {
      position: absolute;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      padding: 8px 14px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      z-index: 25;
      text-align: center;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 22px;
      height: 22px;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
    }
    #crosshair::after {
      content: '';
      position: absolute;
      top: 9px;
      left: 9px;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
    }

    #target-label {
      position: absolute;
      transform: translate(-50%, -100%);
      color: #ffffff;
      font-weight: 800;
      font-size: clamp(15px, 3.5vw, 20px);
      text-shadow: 0 0 8px #000, 0 2px 4px #000;
      pointer-events: none;
      z-index: 5;
      display: none;
    }

    #tutorial-card {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 20px;
      border-radius: 18px;
      text-align: center;
      width: clamp(280px, 86%, 420px);
      z-index: 10;
    }
    #tutorial-card .action { font-size: 15px; font-weight: 800; color: #38ef7d; }
    #tutorial-card .desc { font-size: 12px; color: #cbd5e1; margin-top: 3px; }

    /* 最上層遮罩與按鈕強制點擊 */
    #calib-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 99999;
      text-align: center;
      padding: 24px;
    }
    #calib-overlay h2 { font-size: 28px; margin-bottom: 8px; color: #00e5ff; }
    #calib-overlay p { font-size: 15px; color: #cbd5e1; max-width: 440px; line-height: 1.5; }
    #calib-count { font-size: 56px; font-weight: 900; color: #ffeb3b; margin-top: 12px; display: none; }
    
    #start-btn {
      margin-top: 22px;
      padding: 15px 36px;
      background: #00e5ff;
      border: none;
      border-radius: 30px;
      color: #000;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 229, 255, 0.5);
    }
    #skip-btn {
      margin-top: 14px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #94a3b8;
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
    }
    #error-box {
      color: #ff5252;
      background: rgba(255, 82, 82, 0.15);
      border: 1px solid #ff5252;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 14px;
      max-width: 440px;
      display: none;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="app-container">
    <div id="camera-viewport">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="skeleton-canvas"></canvas>
      <div id="cam-tag">● POSE TRACKER</div>
    </div>

    <div id="game-viewport">
      <div id="ui">
        <div id="stage-title">輕鬆教學 (1/3)</div>
        <div id="score">得分: 0 / 9</div>
      </div>
      <button id="reset-btn">🔄 重設 (按 R)</button>

      <div id="crosshair"></div>
      <div id="target-label">-- m</div>

      <div id="tutorial-card">
        <div class="action">放鬆滑翔</div>
        <div class="desc">雙手平放對準鏡頭，角色具備自動吸附功能，直線巡航！</div>
      </div>
    </div>
  </div>

  <div id="calib-overlay">
    <h2>體感飛行競速</h2>
    <p>請將設備置於前方，人退後至上半身與雙手皆可完整入鏡。</p>
    <button id="start-btn">開啟攝影機開始</button>
    <button id="skip-btn">跳過攝影機，使用鍵盤操作</button>
    <div id="error-box"></div>
    <div id="calib-count">3</div>
  </div>

  <script>
    window.gameControlMode = 'none'; // 'camera' or 'keyboard'
    window.globalPoseData = { roll: 0, pitch: 0, flap: false };

    const startBtn = document.getElementById("start-btn");
    const skipBtn = document.getElementById("skip-btn");
    const calibOverlay = document.getElementById("calib-overlay");
    const calibCount = document.getElementById("calib-count");
    const errorBox = document.getElementById("error-box");
    const video = document.getElementById("webcam");

    // 點擊「開啟攝影機」
    startBtn.onclick = async function() {
      errorBox.style.display = "none";
      startBtn.innerText = "連線攝影機中...";

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("瀏覽器限制攝影機存取，請確保在 127.0.0.1 或 HTTPS 網域下。");
        }

        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const stream = await navigator.mediaDevices.getUserMedia({
          video: isMobile
            ? { facingMode: "user", width: { ideal: 480 }, height: { ideal: 640 } }
            : { width: { ideal: 640 }, height: { ideal: 480 } }
        });

        video.srcObject = stream;
        await video.play();

        startBtn.style.display = "none";
        skipBtn.style.display = "none";
        calibCount.style.display = "block";

        window.gameControlMode = 'camera';
        window.dispatchEvent(new CustomEvent("camera-ready"));
      } catch (err) {
        errorBox.style.display = "block";
        errorBox.innerText = "無法開啟攝影機：" + err.message + "。請直接點擊下方按鈕以鍵盤體驗！";
        startBtn.innerText = "重試開啟攝影機";
      }
    };

    // 點擊「跳過攝影機，使用鍵盤」
    skipBtn.onclick = function() {
      window.gameControlMode = 'keyboard';
      calibOverlay.style.display = "none";
      document.getElementById("camera-viewport").style.display = "none";
      const tutCard = document.getElementById("tutorial-card");
      tutCard.querySelector(".action").innerText = "鍵盤控制模式";
      tutCard.querySelector(".desc").innerText = "方向鍵 [←][→] 轉彎，[↑][↓] 俯仰，[空白鍵] 拍翅加速！";
    };
  </script>

  <script type="module">
    import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

    // --- 1. Three.js 場景 ---
    const gameContainer = document.getElementById("game-viewport");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.0018);

    const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    gameContainer.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.3));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(60, 120, 60);
    scene.add(dirLight);

    const groundGeo = new THREE.PlaneGeometry(3000, 3000, 36, 36);
    groundGeo.rotateX(-Math.PI / 2);
    const pos = groundGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      pos.setY(i, Math.sin(pos.getX(i) * 0.009) * Math.cos(pos.getZ(i) * 0.009) * 14 - 32);
    }
    groundGeo.computeVertexNormals();
    scene.add(new THREE.Mesh(groundGeo, new THREE.MeshLambertMaterial({ color: 0x5ea855, flatShading: true })));

    const player = new THREE.Group();
    const birdMesh = new THREE.Mesh(
      new THREE.ConeGeometry(0.9, 3.4, 5).rotateX(Math.PI / 2),
      new THREE.MeshLambertMaterial({ color: 0x00bcd4 })
    );
    player.add(birdMesh);
    const wings = new THREE.Mesh(
      new THREE.BoxGeometry(4.8, 0.12, 1.0),
      new THREE.MeshLambertMaterial({ color: 0x8bc34a })
    );
    player.add(wings);
    player.position.set(0, 18, 0);
    scene.add(player);

    const rings = [];
    const ringGeo = new THREE.TorusGeometry(8.5, 0.45, 12, 36);
    const ringsData = [
      { x: 0, y: 18, z: -75 },
      { x: 0, y: 13, z: -160 },
      { x: 0, y: 22, z: -250 },
      { x: 10, y: 20, z: -340 },
      { x: 16, y: 18, z: -430 },
      { x: 6,  y: 16, z: -520 },
      { x: -8, y: 18, z: -610 },
      { x: -14, y: 20, z: -700 },
      { x: 0,   y: 18, z: -790 }
    ];

    ringsData.forEach((data, idx) => {
      const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: idx < 3 ? 0xffea00 : 0x00e5ff }));
      ring.position.set(data.x, data.y, data.z);
      scene.add(ring);
      rings.push(ring);
    });

    const guideLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
      new THREE.LineBasicMaterial({ color: 0x00f2fe, linewidth: 2, transparent: true, opacity: 0.8 })
    );
    scene.add(guideLine);

    const indicatorGroup = new THREE.Group();
    const coneMesh = new THREE.Mesh(
      new THREE.ConeGeometry(1.8, 2.8, 4).rotateX(Math.PI),
      new THREE.MeshBasicMaterial({ color: 0x38ef7d, transparent: true, opacity: 0.9 })
    );
    indicatorGroup.add(coneMesh);
    scene.add(indicatorGroup);

    function handleResize() {
      const w = gameContainer.clientWidth;
      const h = gameContainer.clientHeight;
      if (w === 0 || h === 0) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener("resize", handleResize);
    handleResize();

    // --- 2. MediaPipe 背景非同步追蹤 ---
    const canvas = document.getElementById("skeleton-canvas");
    const canvasCtx = canvas.getContext("2d");
    let poseLandmarker = null;
    let drawingUtils = null;
    let isCalibrating = false;
    let neutralPitchOffset = 0.0;
    let calibSamples = [];
    let prevWristY = 0;

    window.addEventListener("camera-ready", async () => {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      startCalibrationCountdown();

      try {
        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
        poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numPoses: 1
        });
        drawingUtils = new DrawingUtils(canvasCtx);
        predict();
      } catch(e) {
        console.warn("AI 骨架追蹤模組加載失敗，切換為滑翔模式：", e);
      }
    });

    function startCalibrationCountdown() {
      isCalibrating = true;
      let count = 3;
      calibCount.innerText = count;
      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          calibCount.innerText = count;
        } else {
          clearInterval(timer);
          if (calibSamples.length > 0) {
            neutralPitchOffset = calibSamples.reduce((a, b) => a + b, 0) / calibSamples.length;
          }
          isCalibrating = false;
          calibOverlay.style.display = "none";
        }
      }, 1000);
    }

    let lastVideoTime = -1;
    function predict() {
      if (video.currentTime !== lastVideoTime && poseLandmarker) {
        lastVideoTime = video.currentTime;
        const result = poseLandmarker.detectForVideo(video, performance.now());
        canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

        if (result.landmarks && result.landmarks[0]) {
          const lm = result.landmarks[0];
          canvasCtx.save();
          canvasCtx.scale(-1, 1);
          canvasCtx.translate(-canvas.width, 0);
          drawingUtils.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color: '#00e5ff', lineWidth: 3 });
          drawingUtils.drawLandmarks([lm[11], lm[12], lm[15], lm[16]], { color: '#ffeb3b', lineWidth: 4 });
          canvasCtx.restore();

          const lWrist = lm[15], rWrist = lm[16];
          const lShoulder = lm[11], rShoulder = lm[12];

          const dx = rWrist.x - lWrist.x;
          const dy = rWrist.y - lWrist.y;
          let roll = Math.atan2(dy, dx);
          if (Math.abs(roll) < 0.14) roll = 0;
          else roll = Math.sign(roll) * (Math.abs(roll) - 0.14);

          const wristAvgY = (lWrist.y + rWrist.y) / 2;
          const shoulderAvgY = (lShoulder.y + rShoulder.y) / 2;
          const currentPitch = wristAvgY - shoulderAvgY;

          if (isCalibrating) {
            calibSamples.push(currentPitch);
          } else {
            let diff = (currentPitch - neutralPitchOffset) * 1.8;
            if (Math.abs(diff) < 0.1) diff = 0;
            window.globalPoseData.pitch = Math.max(-0.45, Math.min(0.45, diff));
          }

          window.globalPoseData.roll = roll * 0.9;
          if (!isCalibrating && (wristAvgY - prevWristY > 0.07)) {
            window.globalPoseData.flap = true;
          }
          prevWristY = wristAvgY;
        }
      }
      requestAnimationFrame(predict);
    }

    // --- 3. 遊戲邏輯與按鍵監聽 ---
    let smoothRoll = 0, smoothPitch = 0, flapBoost = 0;
    let currentRingIndex = 0, score = 0;
    const baseSpeed = 0.75;

    const keys = {};
    window.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (e.code === "Space") flapBoost = 0.65;
      if (e.key === "r" || e.key === "R") resetGame();
    });
    window.addEventListener("keyup", (e) => { keys[e.code] = false; });

    const scoreEl = document.getElementById("score");
    const stageTitle = document.getElementById("stage-title");
    const targetLabel = document.getElementById("target-label");
    const tutCard = document.getElementById("tutorial-card");
    const resetBtn = document.getElementById("reset-btn");

    function resetGame() {
      player.position.set(0, 18, 0);
      player.rotation.set(0, 0, 0);
      smoothRoll = 0; smoothPitch = 0; flapBoost = 0;
      score = 0; currentRingIndex = 0;
      scoreEl.innerText = `得分: 0 / ${rings.length}`;
      rings.forEach((ring, idx) => ring.material.color.setHex(idx < 3 ? 0xffea00 : 0x00e5ff));
      if (window.gameControlMode === 'camera') startCalibrationCountdown();
    }
    resetBtn.onclick = resetGame;

    // --- 4. 主渲染循環 ---
    const smoothedCamPos = new THREE.Vector3(0, 22, 10);
    const smoothedLookTarget = new THREE.Vector3(0, 18, -10);

    function animate() {
      requestAnimationFrame(animate);

      if (window.gameControlMode === 'none') {
        renderer.render(scene, camera);
        return;
      }

      let rawRoll = 0, rawPitch = 0;
      if (window.gameControlMode === 'keyboard') {
        if (keys["ArrowLeft"] || keys["KeyA"]) rawRoll = -0.4;
        else if (keys["ArrowRight"] || keys["KeyD"]) rawRoll = 0.4;
        if (keys["ArrowUp"] || keys["KeyW"]) rawPitch = -0.3;
        else if (keys["ArrowDown"] || keys["KeyS"]) rawPitch = 0.3;
      } else if (window.gameControlMode === 'camera' && !isCalibrating) {
        rawRoll = window.globalPoseData.roll;
        rawPitch = window.globalPoseData.pitch;
        if (window.globalPoseData.flap) {
          flapBoost = 0.65;
          window.globalPoseData.flap = false;
        }
      }

      smoothRoll = THREE.MathUtils.lerp(smoothRoll, rawRoll, 0.05);
      smoothPitch = THREE.MathUtils.lerp(smoothPitch, rawPitch, 0.05);

      player.rotation.z = -smoothRoll;
      player.rotation.y += -smoothRoll * 0.012;
      player.rotation.x = THREE.MathUtils.lerp(player.rotation.x, smoothPitch, 0.05);

      const forwardDir = new THREE.Vector3(0, 0, -1).applyEuler(player.rotation);
      player.position.addScaledVector(forwardDir, baseSpeed);

      if (flapBoost > 0) {
        player.position.y += flapBoost;
        flapBoost *= 0.88;
      }

      wings.rotation.z = Math.sin(performance.now() * 0.012) * 0.12 + (smoothRoll * 0.15);

      const idealCamOffset = new THREE.Vector3(0, 3.5, 9.2).applyEuler(player.rotation);
      smoothedCamPos.lerp(player.position.clone().add(idealCamOffset), 0.06);
      camera.position.copy(smoothedCamPos);

      const idealLookTarget = player.position.clone().add(forwardDir.clone().multiplyScalar(15));
      smoothedLookTarget.lerp(idealLookTarget, 0.07);
      camera.lookAt(smoothedLookTarget);

      if (currentRingIndex < rings.length) {
        const targetRing = rings[currentRingIndex];
        const dist = player.position.distanceTo(targetRing.position);

        if (dist < 22.0) {
          player.position.x = THREE.MathUtils.lerp(player.position.x, targetRing.position.x, 0.035);
          player.position.y = THREE.MathUtils.lerp(player.position.y, targetRing.position.y, 0.035);
        }

        const linePos = guideLine.geometry.attributes.position.array;
        linePos[0] = player.position.x; linePos[1] = player.position.y; linePos[2] = player.position.z;
        linePos[3] = targetRing.position.x; linePos[4] = targetRing.position.y; linePos[5] = targetRing.position.z;
        guideLine.geometry.attributes.position.needsUpdate = true;
        guideLine.visible = true;

        indicatorGroup.position.set(
          targetRing.position.x,
          targetRing.position.y + 9.5 + Math.sin(performance.now() * 0.005) * 0.5,
          targetRing.position.z
        );
        coneMesh.rotation.y += 0.02;
        indicatorGroup.visible = true;

        const screenPos = indicatorGroup.position.clone();
        screenPos.y += 2.0;
        screenPos.project(camera);

        if (screenPos.z < 1) {
          const x = (screenPos.x * 0.5 + 0.5) * gameContainer.clientWidth;
          const y = (-(screenPos.y * 0.5) + 0.5) * gameContainer.clientHeight;
          targetLabel.style.left = `${x}px`;
          targetLabel.style.top = `${y}px`;
          targetLabel.style.display = "block";
          targetLabel.innerText = `${Math.round(dist * 5)} m`;
        } else {
          targetLabel.style.display = "none";
        }

        if (dist < 9.5) {
          targetRing.material.color.setHex(0x55ff55);
          currentRingIndex++;
          score++;
          scoreEl.innerText = `得分: ${score} / ${rings.length}`;
        }
      } else {
        guideLine.visible = false;
        indicatorGroup.visible = false;
        targetLabel.style.display = "none";
        stageTitle.innerText = "🎉 挑戰完成！";
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
